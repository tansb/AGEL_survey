name: hst-pipeline
channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.9
  - numpy
  - pandas
  - astropy
  - astroquery
  - reproject
  - h5py
  - matplotlib
  - scipy
  - seaborn
  - scikit-image
  - pillow
  - opencv          # imported as cv2 in Reproject_and_Rescale.ipynb
  - drizzlepac      # STScI drizzling; conda-forge is the recommended install route
  - photutils       # source detection (pipeline_qc.py: astrometric preflight, N=2 CR source protection)
  - jupyter         # to run the standalone Reproject_and_Rescale.ipynb
  - pip:
    - lenstronomy   # gravitational-lens modelling (offset-fitter step)
    - aplpy         # FITS image display (postage-stamp step)
    - astroalign    # image registration (Reproject_and_Rescale.ipynb)
    - astroscrappy  # L.A.Cosmic cosmic-ray rejection (pipeline_qc.py, N=2 UV drizzle path)
